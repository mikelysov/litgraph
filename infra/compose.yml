name: litgraph-local

volumes:
  frontend_node_modules:
  litgraph_cache:
  litgraph_staging:
  arcadedb_data:

services:
  arcadedb:
    image: arcadedata/arcadedb:latest
    ports: ["7687:7687", "2480:2480"]
    environment:
      - arcadedb.server.rootPassword=change-me
      - arcadedb.server.plugins=Bolt:com.arcadedb.bolt.BoltProtocolPlugin
      - arcadedb.server.defaultDatabases=litrag[]
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2480/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["core"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["redis-local"]

  api:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile
      target: cpu   # Use the cpu stage
    working_dir: /app
    volumes:
      - ../backend:/app
      - litgraph_cache:/cache
      - litgraph_staging:/staging
      - /mnt/d/colab/llms/jina-reranker-v3:/models/jina-reranker-v3:ro
    env_file:
      - ./app/.env
    environment:
      - LITGRAPH_CACHE=/cache/litgraph/paper_index.db
      - INGEST_STAGING_DIR=/staging
      - EMBEDDING_API_URL=http://172.31.61.121:1234/v1
      - EMBEDDING_MODEL=text-embedding-multilingual-e5-large-instruct
      - LLM_API_URL=http://172.31.61.121:1234/v1
      - LLM_MODEL=qwen3.5-4b@q4_k_xl
      - RERANKER_MODEL_PATH=/models/jina-reranker-v3
    depends_on:
      arcadedb:
        condition: service_started
      redis:
        condition: service_started
    command: ["uv", "run", "poe", "server"]
    ports: ["8889:8888"]
    profiles: ["app"]

  worker:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile
      target: cpu   # Use the cpu
    working_dir: /app
    volumes:
      - ../backend:/app
      - litgraph_cache:/cache
      - /mnt/d/colab/llms/jina-reranker-v3:/models/jina-reranker-v3:ro
    env_file:
      - ./app/.env
    environment:
      - LITGRAPH_CACHE=/cache/litgraph/paper_index.db
      - EMBEDDING_API_URL=http://172.31.61.121:1234/v1
      - EMBEDDING_MODEL=text-embedding-multilingual-e5-large-instruct
      - LLM_API_URL=http://172.31.61.121:1234/v1
      - LLM_MODEL=qwen3.5-4b@q4_k_xl
      - RERANKER_MODEL_PATH=/models/jina-reranker-v3
    depends_on:
      arcadedb:
        condition: service_started
      redis:
        condition: service_started
    command: ["uv", "run", "--", "python", "-c", "from src.worker import run_worker_loop; run_worker_loop()"]
    profiles: ["worker"]

  # DEV: Vite + HMR
  frontend-dev:
    build:
      context: ..
      dockerfile: ./frontend/Dockerfile
      target: dev
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: ["bun", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      api:
        condition: service_started
    profiles: ["frontend-dev"]

  mcp:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile
      target: cpu
    working_dir: /app
    volumes:
      - ../backend:/app
      - ../docs:/docs:ro
      - litgraph_cache:/cache
      - litgraph_staging:/staging
      - /mnt/d/colab/llms/jina-reranker-v3:/models/jina-reranker-v3:ro
    env_file:
      - ./app/.env
    environment:
      - LITGRAPH_API_URL=http://api:8888/api
      - LITGRAPH_CACHE=/cache/litgraph/paper_index.db
      - INGEST_STAGING_DIR=/staging
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8888
      - INGEST_PDF_ROOT=/docs
      - EMBEDDING_API_URL=http://172.31.61.121:1234/v1
      - EMBEDDING_MODEL=text-embedding-multilingual-e5-large-instruct
      - EMBEDDING_DIM=1024
      - LLM_API_URL=http://172.31.61.121:1234/v1
      - LLM_MODEL=qwen3.5-4b@q4_k_xl
      - RERANKER_MODEL_PATH=/models/jina-reranker-v3
    depends_on:
      api:
        condition: service_started
      arcadedb:
        condition: service_started
      redis:
        condition: service_started
    command: ["uv", "run", "python", "src/mcp_server.py"]
    ports: ["8888:8888"]
    profiles: ["app"]

  # PROD: nginx serving built assets
  frontend-prod:
    build:
      context: ..
      dockerfile: ./frontend/Dockerfile
      target: prod
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    profiles: ["frontend-prod"]
