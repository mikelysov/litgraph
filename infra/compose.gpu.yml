name: litgraph-local

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["redis-local"]

  api:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile
      target: gpu
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    profiles: ["app"]

  worker:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile
      target: gpu
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    profiles: ["worker"]